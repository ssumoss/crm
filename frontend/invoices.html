<div class="table-actions invoice-filter-actions">
  <select id="docTypeFilter">
    <option value="all">Belge Tipi: Tümü</option>
    <option value="Satış">Satış</option>
    <option value="İade">İade</option>
  </select>

  <select id="salesPointFilter">
    <option value="all">Satış Noktası: Tümü</option>
  </select>

  <input id="startDateFilter" type="date" title="Başlangıç tarihi" />
  <input id="endDateFilter" type="date" title="Bitiş tarihi" />

  <input id="minAmountFilter" type="number" min="0" placeholder="Min tutar" />
  <input id="maxAmountFilter" type="number" min="0" placeholder="Max tutar" />

  <button id="exportInvoicesBtn" type="button" class="export-invoices-btn">
    <i class="fa-solid fa-file-excel"></i>
    Excel Export
  </button>

  <button id="clearInvoiceFiltersBtn" type="button">
    <i class="fa-solid fa-filter-circle-xmark"></i>
    Temizle
  </button>
</div>
